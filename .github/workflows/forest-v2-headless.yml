name: Forest V2 Headless

on:
  push:
    branches: [forest-visual-prototype-v2]
  pull_request:
    branches: [main]

jobs:
  godot-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 official
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Validate V2 PNG headers
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          expected = {
              'assets/art_v2/grass_tile.png': (64, 64),
              'assets/art_v2/dirt_tile.png': (64, 64),
              'assets/art_v2/tree_oak_a.png': (160, 208),
              'assets/art_v2/tree_oak_b.png': (160, 208),
              'assets/art_v2/tree_pine.png': (160, 208),
              'assets/art_v2/bush.png': (80, 64),
              'assets/art_v2/rock.png': (80, 64),
              'assets/art_v2/log.png': (112, 64),
              'assets/art_v2/flowers.png': (64, 48),
              'assets/art_v2/player_ranger_8dir.png': (768, 128),
              'assets/art_v2/monster_slime.png': (80, 64),
              'assets/art_v2/monster_boar.png': (96, 72),
              'assets/art_v2/attack_slash.png': (96, 96),
              'assets/art_v2/shadow.png': (96, 48),
          }
          for name, size in expected.items():
              data = Path(name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'invalid PNG signature: {name}'
              assert data[12:16] == b'IHDR', f'missing IHDR: {name}'
              actual = struct.unpack('>II', data[16:24])
              assert actual == size, f'{name}: expected {size}, got {actual}'
              print(f'PNG_OK {name} {actual[0]}x{actual[1]}')
          print('FOREST_VISUAL_PROTOTYPE_V2_PNG_PASS')
          PY

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          timeout 25s godot --headless --editor --path . --quit 2>&1 | tee import.log
          code=${PIPESTATUS[0]}
          test "$code" -eq 0

      - name: Run V1 regression contracts
        shell: bash
        run: |
          set -euo pipefail
          : > contracts.log
          for test_script in \
            res://tests/test_project_boot.gd \
            res://tests/test_player_contract.gd \
            res://tests/test_asset_contract.gd \
            res://tests/test_forest_layout_contract.gd \
            res://tests/test_monster_contract.gd
          do
            echo "=== $test_script ===" | tee -a contracts.log
            timeout 20s godot --headless --path . --script "$test_script" 2>&1 | tee -a contracts.log
          done

      - name: Run V2 visual contract
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . --script res://tests/test_visual_v2_contract.gd 2>&1 | tee v2.log
          code=${PIPESTATUS[0]}
          test "$code" -eq 0

      - name: Boot forest scene
        shell: bash
        run: |
          set -o pipefail
          timeout 12s godot --headless --path . --quit-after 2 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          test "$code" -eq 0

      - name: Reject hidden load errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat import.log contracts.log v2.log smoke.log 2>/dev/null > all.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource" all.log; then
            echo "Forbidden Godot load/script error found"
            exit 1
          fi
          echo "FOREST_VISUAL_PROTOTYPE_V2_PASS"
