name: Forest V3 Headless

on:
  push:
    branches: [forest-visual-prototype-v3]
  pull_request:
    branches: [main]

jobs:
  godot-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 official
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Validate V3 source assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              Path('assets/art_v3/warrior_greatsword_8dir.svg'): ('0 0 768 128', '768', '128'),
              Path('assets/art_v3/greatsword_slash.svg'): ('0 0 144 144', '144', '144'),
          }
          for path, (viewbox, width, height) in expected.items():
              assert path.is_file(), f'missing V3 SVG: {path}'
              root = ET.parse(path).getroot()
              assert root.attrib.get('viewBox') == viewbox, f'wrong viewBox: {path}'
              assert root.attrib.get('width') == width, f'wrong width: {path}'
              assert root.attrib.get('height') == height, f'wrong height: {path}'
              print(f'SVG_OK {path} {width}x{height}')
          assert not Path('assets/art_v3/warrior_greatsword_8dir.png').exists(), 'corrupted warrior PNG must not remain'
          assert not Path('assets/art_v3/greatsword_slash.png').exists(), 'corrupted slash PNG must not remain'
          print('FOREST_VISUAL_PROTOTYPE_V3_SOURCE_ASSET_PASS')
          PY

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          timeout 25s godot --headless --editor --path . --quit 2>&1 | tee import.log
          code=${PIPESTATUS[0]}
          test "$code" -eq 0

      - name: Run core regression contracts
        shell: bash
        run: |
          set -euo pipefail
          : > contracts.log
          for test_script in \
            res://tests/test_project_boot.gd \
            res://tests/test_player_contract.gd \
            res://tests/test_asset_contract.gd \
            res://tests/test_forest_layout_contract.gd \
            res://tests/test_monster_contract.gd
          do
            echo "=== $test_script ===" | tee -a contracts.log
            timeout 20s godot --headless --path . --script "$test_script" 2>&1 | tee -a contracts.log
          done

      - name: Run V3 visual contract
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . --script res://tests/test_visual_v3_contract.gd 2>&1 | tee v3.log
          code=${PIPESTATUS[0]}
          test "$code" -eq 0

      - name: Boot forest scene
        shell: bash
        run: |
          set -o pipefail
          timeout 12s godot --headless --path . --quit-after 2 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          test "$code" -eq 0

      - name: Reject hidden load errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat import.log contracts.log v3.log smoke.log 2>/dev/null > all.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|ERR_FILE_CORRUPT|Error importing|Error loading image|Tried to set Z index" all.log; then
            echo "Forbidden Godot load/script/asset/depth error found"
            exit 1
          fi
          echo "FOREST_VISUAL_PROTOTYPE_V3_PASS"
